<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>to-do</title>
    <link href="./src/output.css" rel="stylesheet" />
  </head>
  <body class="bg-[#0F172A] text-white p-4">
    <div class="flex flex-col md:flex-row md:justify-between">
      <h1
        class="text-5xl font-bold font-serif mb-4 md:text-6xl lg:text-8xl md:text-red-500 lg:text-pink-600"
      >
        Plan & Do
      </h1>
      <div
        class="w-full flex justify-evenly flex-wrap gap-4 md:w-xs md:justify-evenly lg:gap-1 lg:justify-evenly lg:w-96"
      >
        <div
          class="bg-slate-700 border border-[#0e01f6] h-20 w-16 rounded-sm md:h-28 md:w-20 lg:h-36 lg:w-28"
        >
          <h2 class="font-bold text-2xl text-center pb-1">Total</h2>
          <hr class="h-0.5 bg-[#09036b] border-0" />
          <p
            class="text-center font-bold text-xl mt-1 md:mt-4 md:text-2xl lg:text-4xl lg:mt-6"
          >
            _
          </p>
        </div>

        <div
          class="bg-slate-700 border border-green-500 h-20 w-16 rounded-sm md:h-28 md:w-20 lg:h-36 lg:w-28"
        >
          <h2 class="font-bold text-2xl text-center pb-1">Done</h2>
          <hr class="h-0.5 bg-green-500 border-0" />
          <p
            class="text-center font-bold text-xl mt-1 md:mt-4 md:text-2xl lg:text-4xl lg:mt-6"
          >
            7
          </p>
        </div>

        <div
          class="bg-slate-700 border border-[#EF4444] h-20 w-24 rounded-sm md:h-28 md:w-28 lg:h-36 lg:w-28"
        >
          <h2 class="font-bold text-2xl text-center pb-1">Pending</h2>
          <hr class="h-0.5 bg-[#8f0707] border-0" />
          <p
            class="text-center font-bold text-xl mt-1 md:mt-4 md:text-2xl lg:text-4xl lg:mt-6"
          >
            1
          </p>
        </div>
      </div>
    </div>

    <div class="bg-slate-800 mt-14 rounded-sm p-4">
      <input
        type="text"
        placeholder="Task Name"
        id="taskName"
        class="bg-white text-black w-[90%] p-2 mb-3 rounded md:w-[38%] md:mr-2"
      />
      <input
        type="date"
        class="bg-white text-black w-[90%] p-2 rounded md:w-[38%] md:mr-2"
        id="taskDate"
      />
      <button
        class="p-2 bg-purple-600 rounded-sm font-bold mt-3 mb-10 hover:bg-purple-700 md:w-[15%]"
        id="addTask"
      >
        + Add Task
      </button>

      <div id="taskList">
        <div class="task hidden"> <!--this is a task card and it is hidden-->
          <div class="md:flex md:justify-between">
            <p class="font-semibold">Task Name 1</p>
            <p class="text-gray-900 md:font-semibold">dd-mm-yyyy</p>
          </div>
          <div class="md:flex md:gap-4">
            <button
              class="bg-[#22C55E] rounded-sm p-1 font-semibold block mt-4 md:mt-4 hover:bg-[#05ad42]"
            >
              Mark As Complete
            </button>
            <button
              class="bg-[#EF4444] rounded-sm p-1 font-semibold block mt-2 md:mt-4 hover:bg-[#8f0707]"
            >
              Delete
            </button>
          </div>
        </div>
      </div>
    </div>


    <script src="./js/script.js"></script>
  </body>
</html>
